[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "conference-planner"
version = "0.1.0"
description = "Personal self-hosted Telegram bot for scientific conference deadline tracking"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.16,<2",
  "aiogram>=3.20,<4",
  "aiosqlite>=0.21,<1",
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "rapidfuzz>=3.13,<4",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
conference-planner = "conference_planner.main:run"
conference-planner-healthcheck = "conference_planner.healthcheck:run"

[tool.hatch.build.targets.wheel]
packages = ["src/conference_planner"]

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["TASK.md", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001"]
